services:
  # ------------------------------------------------------------
  # PostgreSQL + PostGIS
  # ------------------------------------------------------------
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: rentcar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rentcar
      POSTGRES_PASSWORD: rentcarpass
      POSTGRES_DB: rentcar_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentcar -d rentcar_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------
  # Redis
  # ------------------------------------------------------------
  redis:
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
    container_name: rentcar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5

  # ------------------------------------------------------------
  # MinIO (S3)
  # ------------------------------------------------------------
  minio:
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
    container_name: rentcar-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Инициализация бакета (отдельный сервис)
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb myminio/rentcar-images --ignore-existing;
      mc anonymous set public myminio/rentcar-images;
      echo 'S3 READY';
      exit 0;
      "

  # ------------------------------------------------------------
  # PHP-FPM (Symfony)
  # ------------------------------------------------------------
  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile   # собираем из корня
    container_name: rentcar-php
    restart: unless-stopped
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://rentcar:rentcarpass@postgres:5432/rentcar_db
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: rentcar-images
      S3_USE_SSL: false
      S3_EXTERNAL_ENDPOINT: http://localhost:9000
      PHP_MEMORY_LIMIT: 512M
      PHP_MAX_EXECUTION_TIME: 300
    volumes:
      - ./backend:/var/www/html   # монтируем код для разработки
      - /var/www/html/var/cache   # исключаем кеш (чтобы не перезаписывался)
      - /var/www/html/var/log
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # (опционально) автоматический запуск миграций
    # command: sh -c "composer install --no-interaction && php bin/console doctrine:migrations:migrate --no-interaction && php-fpm"

  # ------------------------------------------------------------
  # Nginx
  # ------------------------------------------------------------
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: rentcar-nginx
    restart: unless-stopped
    ports:
      - "3001:80"            # внешний порт 3001 → внутренний 80
    volumes:
      - ./backend:/var/www/html:cached   # чтобы Nginx видел public/
    depends_on:
      - php

  # ------------------------------------------------------------
  # Фронтенд (React / Next.js) — без изменений
  # ------------------------------------------------------------
  frontend:
    build: ./frontend
    container_name: rentcar-frontend
    restart: unless-stopped
    ports:
      - "3003:3000"
    volumes:
      - ./frontend:/app  # Добавьте эту строку
      - /app/node_modules
    command: [ "npm", "run", "dev" ]
    environment:
      NEXT_PUBLIC_API_URL: /api
      API_INTERNAL_URL: http://nginx/api
    depends_on:
      - nginx

volumes:
  pgdata:
  redisdata:
  miniodata: