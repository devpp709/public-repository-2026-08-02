nelmio_cors:
    defaults:
        allow_origin:
            - 'http://localhost:3000'
            - 'http://localhost:3002'
            - 'http://localhost:3003'
            - 'http://localhost:3004'
            - 'http://31.31.201.163:3003'
            - 'http://31.31.201.163:3004'
            - 'https://31.31.201.163:3003'
            - 'https://31.31.201.163:3004'
            - 'http://31.31.201.163'  # ДОБАВЬТЕ ЭТО!
            - 'http://31.31.201.163:80'  # ДОБАВЬТЕ ЭТО!
            - 'http://rentcar-admin:5173'
            - 'http://rentcar-frontend:3000'
        allow_credentials: true
        allow_methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
        allow_headers:
            - Content-Type
            - Authorization
            - Accept
            - X-Locale
            - X-Requested-With
        expose_headers:
            - Link
            - Content-Length
            - X-Request-ID
        max_age: 3600

    paths:
        '^/api/':
            allow_origin:
                - 'http://localhost:3000'
                - 'http://localhost:3002'
                - 'http://localhost:3003'
                - 'http://localhost:3004'
                - 'http://31.31.201.163:3003'
                - 'http://31.31.201.163:3004'
                - 'https://31.31.201.163:3003'
                - 'https://31.31.201.163:3004'
                - 'http://31.31.201.163'  # ДОБАВЬТЕ ЭТО!
                - 'http://31.31.201.163:80'  # ДОБАВЬТЕ ЭТО!
                - 'http://rentcar-admin:5173'
                - 'http://rentcar-frontend:3000'
            allow_credentials: true
            allow_methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
            allow_headers:
                - Content-Type
                - Authorization
                - Accept
                - X-Locale
                - X-Requested-With
            max_age: 3600

        '^/':
            allow_origin:
                - 'http://localhost:3000'
                - 'http://localhost:3002'
                - 'http://localhost:3003'
                - 'http://localhost:3004'
                - 'http://31.31.201.163:3003'
                - 'http://31.31.201.163:3004'
                - 'http://31.31.201.163'  # ДОБАВЬТЕ ЭТО!
            allow_credentials: true
            allow_methods:
                - GET
                - OPTIONS
            allow_headers:
                - Content-Type
                - Accept
                - X-Locale
            max_age: 3600
