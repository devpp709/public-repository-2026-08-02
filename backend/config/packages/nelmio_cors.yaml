nelmio_cors:
    defaults:
        allow_origin: ['http://localhost:3003', 'http://localhost:3000']
        allow_methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS']
        allow_headers: ['Content-Type', 'Authorization', 'Accept', 'X-Locale']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/api/':
            allow_origin: ['http://localhost:3003']
            allow_methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS']
            allow_headers: ['Content-Type', 'Authorization', 'Accept']
            max_age: 3600
        '^/':
            allow_origin: ['http://localhost:3003']
            allow_methods: ['GET', 'OPTIONS']
            allow_headers: ['Content-Type', 'Accept']
            max_age: 3600
