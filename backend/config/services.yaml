# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    s3.endpoint: '%env(S3_ENDPOINT)%'
    s3.access_key: '%env(S3_ACCESS_KEY)%'
    s3.secret_key: '%env(S3_SECRET_KEY)%'
    s3.bucket: '%env(S3_BUCKET)%'
    s3.public_endpoint: '%env(S3_EXTERNAL_ENDPOINT)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    aws.s3.client:
        class: 'Aws\S3\S3Client'
        arguments:
            - version: 'latest'
              region: 'us-east-1'
              endpoint: '%s3.endpoint%'
              use_path_style_endpoint: true
              credentials:
                  key: '%s3.access_key%'
                  secret: '%s3.secret_key%'

    league\flysystem\FilesystemInterface: '@default.storage'

    App\Middleware\CorsMiddleware:
        arguments:
            - '@http_kernel'
        tags:
            - { name: kernel.http_kernel }

    App\Service\AuthService:
        arguments:
            - '@App\Repository\UserRepository'
            - '@App\Repository\RefreshTokenRepository'
            - '@security.user_password_hasher'
            - '@lexik_jwt_authentication.jwt_manager'

    App\Service\CarClassService:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $carClassRepository: '@App\Repository\CarClassRepository'

    App\Validator\UniqueCarClassNameValidator:
        arguments:
            $carClassService: '@App\Service\CarClassService'
        tags: [ 'validator.constraint_validator' ]
